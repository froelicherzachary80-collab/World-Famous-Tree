# XcodeGen spec — generates WorldTreeAI.xcodeproj on the macOS CI runner (`xcodegen generate`).
name: WorldTreeAI
options:
  bundleIdPrefix: ai.worldtree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
packages:
  WorldTreeCore:
    path: WorldTreeCore
targets:
  WorldTreeAI:
    type: application
    platform: iOS
    sources:
      - path: WorldTreeApp/Sources
      - path: WorldTreeApp/Resources
    dependencies:
      - package: WorldTreeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.worldtree.app
        PRODUCT_NAME: WorldTreeAI
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "World Tree AI"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "World Tree AI connects to the research server you run on your own computer."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: WorldTreeApp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - ai.worldtree.app.research.refresh
          - ai.worldtree.app.research.processing
          - ai.worldtree.app.research.continued.*
        UIUserInterfaceStyle: Dark
  WorldTreeAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WorldTreeAppUITests]
    dependencies:
      - target: WorldTreeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.worldtree.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorldTreeAI:
    build:
      targets:
        WorldTreeAI: all
    test:
      targets: [WorldTreeAIUITests]
