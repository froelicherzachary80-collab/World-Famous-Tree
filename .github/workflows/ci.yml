name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -v

  swift-core:
    name: WorldTreeCore tests (Swift)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: swift test
        working-directory: ios/WorldTreeCore
        run: swift test

  ios:
    name: iOS app build, UI test, unsigned IPA
    runs-on: macos-26
    needs: [swift-core]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: UI tests (launch + navigation) on simulator
        working-directory: ios
        run: |
          DEST=$(../scripts/pick-simulator.sh)
          xcodebuild test -project WorldTreeAI.xcodeproj -scheme WorldTreeAI \
            -destination "$DEST" CODE_SIGNING_ALLOWED=NO | tee ../ui-test.log | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
      - name: Archive for device (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive -project WorldTreeAI.xcodeproj -scheme WorldTreeAI -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/WorldTreeAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
      - name: Package IPA
        run: bash scripts/package-ipa.sh ios/build/WorldTreeAI.xcarchive WorldTreeAI-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WorldTreeAI-unsigned-ipa
          path: WorldTreeAI-unsigned.ipa
          retention-days: 30
